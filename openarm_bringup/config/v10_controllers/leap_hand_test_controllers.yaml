controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Joint State Broadcaster
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # LEAP Hand Forward Position Controller
    leap_hand_controller:
      type: forward_command_controller/ForwardCommandController

leap_hand_controller:
  ros__parameters:
    # All 16 finger joints (matching leap_hand_right.xacro)
    joints:
      - right_index_mcp_forward
      - right_index_mcp_side
      - right_index_pip
      - right_index_dip
      - right_middle_mcp_forward
      - right_middle_mcp_side
      - right_middle_pip
      - right_middle_dip
      - right_ring_mcp_forward
      - right_ring_mcp_side
      - right_ring_pip
      - right_ring_dip
      - right_thumb_mcp_side
      - right_thumb_mcp_forward
      - right_thumb_pip_joint
      - right_thumb_dip_joint
    interface_name: position
