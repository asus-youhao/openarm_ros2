  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 50.0

    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

right_forward_position_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position


# ============================================================================
# LEFT O6 HAND CONTROLLERS
# ============================================================================

left_hand_controller:
  ros__parameters:
    joints:
      - L_thumb_cmc_pitch
      - L_thumb_cmc_yaw
      - L_index_mcp_pitch
      - L_middle_mcp_pitch
      - L_ring_mcp_pitch
      - L_pinky_mcp_pitch

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: true

    # Start with current position, don't move to zero on activation
    open_loop_control: false
    allow_nonzero_velocity_at_trajectory_end: true

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

left_hand_forward_position_controller:
  ros__parameters:
    joints:
      - L_thumb_cmc_pitch
      - L_thumb_cmc_yaw
      - L_index_mcp_pitch
      - L_middle_mcp_pitch
      - L_ring_mcp_pitch
      - L_pinky_mcp_pitch
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position


