# OpenArm V10 Bimanual with O6 Hands controller configuration
# This file configures controllers for:
# - Left and right V10 arms (7 DOF each)
# - Left and right O6 hands (6 DOF each)

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Arm controllers - trajectory mode
    left_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Arm controllers - forward position mode
    left_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    right_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    # Hand controllers - trajectory mode
    left_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Hand controllers - forward position mode
    left_hand_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    right_hand_forward_position_controller:
      type: forward_command_controller/ForwardCommandController


# ============================================================================
# LEFT ARM CONTROLLERS
# ============================================================================

left_joint_trajectory_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 50.0

    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

left_forward_position_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position


# ============================================================================
# RIGHT ARM CONTROLLERS
